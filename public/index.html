        <h1>Reelin In the Ears</h1>
        <h2>Welcome to your reverse song-to-movie search app.</h2>
    </header>
    <p>Search your favorite songs to get recommendations for movies that 
        feature them. Add movies that interest you to your own personal 
        watchlist.
    </p>
    <form id="searchForm">
        <label for="stitle">Song Title:</label><br>
        <input type="text" id="stitle" name="stitle"><br>
        <label for="aname">Artist Name:</label><br>
        <input type="text" id="aname" name="aname"><br>
        <button type="submit" id="submitButton">Submit</button>
        <p id="output"></p>
    </form>
    <script src="app.js"></script>
</body>
